
name: FrameCraft Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FrameCraft APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Check Firebase Configuration
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "ERROR: google-services.json missing!"
            exit 1
          fi
          echo "Firebase configuration found."

      - name: Generate Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Get SHA-1 Fingerprint
        run: |
          keytool -list -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "APK successfully generated!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameCraft-AI-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
